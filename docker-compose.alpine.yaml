# Full local stack. Run: docker compose -f docker-compose.alpine.yaml up -d --build
# Debezium retains its official (non-Alpine) image.
name: logify-alpine

x-app-environment: &app-environment
  APP_ENV: dev
  APP_JWT_SECRET: ${APP_JWT_SECRET:-logify-local-development-secret-change-me}
  APP_POSTGRES_HOST: postgres
  APP_POSTGRES_PORT: "5432"
  APP_POSTGRES_USER: ${POSTGRES_USER:-postgres}
  APP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  APP_POSTGRES_DATABASE: ${POSTGRES_DB:-logify}
  APP_POSTGRES_SSL_MODE: disable
  APP_REDIS_HOST: redis
  APP_KAFKA_BROKERS: kafka:9092
  APP_CLICKHOUSE_HOST: clickhouse
  APP_CLICKHOUSE_PORT: "9000"
  APP_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
  APP_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-mypassword}
  APP_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-logify}

services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile.alpine
    image: logify/postgres:18-alpine-pgvector
    command: ["postgres", "-c", "wal_level=logical"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-logify}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - logify-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - logify-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - logify-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  clickhouse:
    image: clickhouse/clickhouse-server:26.2-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-mypassword}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-logify}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    networks:
      - logify-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrator:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.migrator
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ./migrator -env dev -driver postgres up
        ./migrator -env dev -driver clickhouse up
    restart: "no"
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - logify-net

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: on-failure:3
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment: *app-environment
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - logify-net

  log-processor:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.worker
    restart: on-failure:3
    environment: *app-environment
    depends_on:
      migrator:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - logify-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_LOGIFY_API_BASE_URL: ${NEXT_PUBLIC_LOGIFY_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8080}}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_started
    networks:
      - logify-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  debezium:
    image: debezium/connect:2.5
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1

      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - logify-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  clickhouse_data:
  clickhouse_logs:

networks:
  logify-net:
    driver: bridge
